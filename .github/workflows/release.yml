name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Test
        run: go test -v ./internal/...

      - name: Build binary
        run: |
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -mod=readonly -trimpath -buildvcs=false -ldflags="-s -w" \
              -o "passpicker-${{ matrix.goos }}-${{ matrix.goarch }}" main.go

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: passpicker-${{ matrix.goos }}-${{ matrix.goarch }}
          path: passpicker-${{ matrix.goos }}-${{ matrix.goarch }}

  release:
    name: Create release assets
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: passpicker-*
          merge-multiple: true
          path: dist

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/passpicker-linux-amd64
            dist/passpicker-linux-arm64
            dist/passpicker-darwin-amd64
            dist/passpicker-darwin-arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Render AUR PKGBUILD
        run: |
          sha() { sha256sum "$1" | cut -d' ' -f1; }
          sed -e "s|@VERSION@|${GITHUB_REF_NAME#v}|" \
              -e "s|@SHA_LICENSE@|$(sha LICENSE)|" \
              -e "s|@SHA_DESKTOP@|$(sha resources/passpicker.desktop)|" \
              -e "s|@SHA_X86_64@|$(sha dist/passpicker-linux-amd64)|" \
              -e "s|@SHA_AARCH64@|$(sha dist/passpicker-linux-arm64)|" \
              packaging/aur/PKGBUILD > PKGBUILD

      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: passpicker-bin
          pkgbuild: ./PKGBUILD
          commit_username: njkevlani
          commit_email: njkevlani@gmail.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: ${{ github.ref_name }}
