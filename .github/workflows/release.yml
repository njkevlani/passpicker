name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build linux-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Test
        run: go test -v ./internal/...

      - name: Build binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} \
            go build -mod=readonly -trimpath -buildvcs=false -ldflags="-s -w" \
              -o "passpicker-linux-${{ matrix.goarch }}" main.go

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: passpicker-linux-${{ matrix.goarch }}
          path: passpicker-linux-${{ matrix.goarch }}

  dmg:
    name: Build macOS DMG
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Build darwin binaries
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=darwin GOARCH="$arch" \
              go build -mod=readonly -trimpath -buildvcs=false -ldflags="-s -w" \
                -o "passpicker-darwin-$arch" main.go
          done

      - name: Build DMG
        run: |
          case "$GITHUB_REF_NAME" in
            v*) VERSION="${GITHUB_REF_NAME#v}" ;;
            *)  VERSION="" ;;
          esac
          VERSION="$VERSION" packaging/macos/build-dmg.sh \
            passpicker-darwin-amd64 passpicker-darwin-arm64 passpicker-macos.dmg

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: passpicker-macos-dmg
          path: passpicker-macos.dmg

  release:
    name: Create release assets
    runs-on: ubuntu-latest
    needs: [build, dmg]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: passpicker-*
          merge-multiple: true
          path: dist

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/passpicker-linux-amd64
            dist/passpicker-linux-arm64
            dist/passpicker-macos.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Render AUR PKGBUILD
        run: |
          sha() { sha256sum "$1" | cut -d' ' -f1; }
          sed -e "s|@VERSION@|${GITHUB_REF_NAME#v}|" \
              -e "s|@SHA_LICENSE@|$(sha LICENSE)|" \
              -e "s|@SHA_DESKTOP@|$(sha resources/passpicker.desktop)|" \
              -e "s|@SHA_X86_64@|$(sha dist/passpicker-linux-amd64)|" \
              -e "s|@SHA_AARCH64@|$(sha dist/passpicker-linux-arm64)|" \
              packaging/aur/PKGBUILD > PKGBUILD

      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: passpicker-bin
          pkgbuild: ./PKGBUILD
          commit_username: njkevlani
          commit_email: njkevlani@gmail.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: ${{ github.ref_name }}
