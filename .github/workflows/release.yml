name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Test
        run: go test -v ./internal/...

      - name: Build binary
        run: |
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o "gopassrofi-${{ matrix.goos }}-${{ matrix.goarch }}" main.go

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gopassrofi-${{ matrix.goos }}-${{ matrix.goarch }}
          path: gopassrofi-${{ matrix.goos }}-${{ matrix.goarch }}

  release:
    name: Create release assets
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: gopassrofi-*
          merge-multiple: true
          path: dist

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/gopassrofi-linux-amd64
            dist/gopassrofi-linux-arm64
            dist/gopassrofi-darwin-amd64
            dist/gopassrofi-darwin-arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
